name: Feature request
description: Suggest a change or a new feature.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Devin Mobile is a remote control for Devin CLI running on your own VM. Features that need an editor, a separate model API or a server outside the VM are out of scope.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should the app or the gateway behave?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds or other approaches you have tried.
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - App
        - Gateway
        - Builds and releases
        - Documentation
