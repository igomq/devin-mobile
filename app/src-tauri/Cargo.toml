[package]
name = "devin-mobile"
version = "0.2.0"
description = "Devin Mobile — mobile client for Devin CLI"
authors = ["GomQ"]
license = "MIT"
repository = "https://github.com/igomq/devin-mobile"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "devin_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.7" }
tauri-plugin-log = "2"
